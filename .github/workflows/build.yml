# Klunki builds (KLD-070): PWA, Android APK and app bundle (.aab) as downloadable artifacts, an
# iOS compile check on demand. Nothing goes to a store. Pushing a tag v*
# builds the release (KLD-116, docs/RELEASING.md); every build gets the
# build number from tool/build_number.sh. GitHub Pages (KLD-096)
# is deployed only from main and only when the repository variable
# PAGES_ENABLED is 'true' (see the `pages-build` / `pages` jobs).
#
# Flutter is pinned like in ci.yml (3.47.8 stable, Dart 3.13.7).
# Every action is pinned to a commit SHA (tag in the comment).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  pwa:
    name: PWA (flutter build web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: klunki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tool/build_number.sh counts the day's commits on main (KLD-116).
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      # KLD-116: build number YYYYMMDDNN from the commit date (UTC) and the
      # day's count of commits on the first-parent line; iOS CFBundleVersion
      # and Android versionCode. See docs/RELEASING.md.
      - name: Build number
        run: echo "KLUNKI_BUILD_NUMBER=$(../tool/build_number.sh)" >> "$GITHUB_ENV"
      - run: flutter pub get
      # The documented steps (README.md, docs/DEMO.md, docs/BUILDING.md):
      # build, then fill the offline service worker's build hash and precache list.
      - run: >-
          flutter build web --release
          --dart-define=KLUNKI_BUILD=${{ github.sha }}
          --build-number=${{ env.KLUNKI_BUILD_NUMBER }}
          --dart-define=KLUNKI_BUILD_NUMBER=${{ env.KLUNKI_BUILD_NUMBER }}
      - run: python3 -I build/web/pwa_finalize.py
      # The PWA must start offline: no CanvasKit/fonts/scripts from
      # jsdelivr, unpkg, gstatic or googleapis. Allows only the engine's
      # overridden default URLs (see the script's docstring).
      - name: No external URLs in the build
        run: python3 -I tool/check_pwa_external_urls.py build/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klunki-pwa
          path: klunki/build/web
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK + app bundle (flutter build apk, appbundle)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: klunki
    env:
      # Optional real signing (KLD-053). Without these repository secrets the
      # release APK is signed with the debug key (see android/app/build.gradle.kts).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KLUNKI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KLUNKI_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      KLUNKI_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tool/build_number.sh counts the day's commits on main (KLD-116).
          fetch-depth: 0
      # AGP 9.1 / Gradle 9.3.1 / Kotlin 2.4 need JDK 17 or newer; Flutter's
      # template compiles for Java 17.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      # The ubuntu runner image ships an Android SDK (ANDROID_HOME) with
      # cmdline-tools; AGP downloads missing platforms/NDK itself once the
      # licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      # android/gradle.properties asks for an 8 GB Gradle heap (Flutter
      # template); private-repo runners have 7 GB RAM. The user-level
      # gradle.properties overrides the project's.
      - name: Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError' >> ~/.gradle/gradle.properties
      - name: Release keystore (only if the secrets exist)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klunki-release.jks"
            echo "KLUNKI_KEYSTORE_FILE=$RUNNER_TEMP/klunki-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from the repository secrets."
          else
            echo "::notice::No KEYSTORE_BASE64 secret: the APK is signed with the debug key (fine for testing, not for a store)."
          fi
      - run: flutter --version
      # KLD-116: build number YYYYMMDDNN from the commit date (UTC) and the
      # day's count of commits on the first-parent line; iOS CFBundleVersion
      # and Android versionCode. See docs/RELEASING.md.
      - name: Build number
        run: echo "KLUNKI_BUILD_NUMBER=$(../tool/build_number.sh)" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: >-
          flutter build apk --release
          --dart-define=KLUNKI_BUILD=${{ github.sha }}
          --build-number=${{ env.KLUNKI_BUILD_NUMBER }}
          --dart-define=KLUNKI_BUILD_NUMBER=${{ env.KLUNKI_BUILD_NUMBER }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klunki-android-apk
          path: klunki/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      # The Play Store format (docs/PLAYSTORE.md). Same signing as the APK:
      # without the KEYSTORE_* secrets it carries the debug key, which Play
      # Console rejects, so such a bundle is for checking the build only.
      - run: >-
          flutter build appbundle --release
          --dart-define=KLUNKI_BUILD=${{ github.sha }}
          --build-number=${{ env.KLUNKI_BUILD_NUMBER }}
          --dart-define=KLUNKI_BUILD_NUMBER=${{ env.KLUNKI_BUILD_NUMBER }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klunki-android-aab
          path: klunki/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    # macOS minutes cost 10x on a private repo: manual runs only.
    if: github.event_name == 'workflow_dispatch'
    name: iOS compile check (no codesign)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: klunki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tool/build_number.sh counts the day's commits on main (KLD-116).
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - run: xcodebuild -version
      # KLD-116: build number YYYYMMDDNN from the commit date (UTC) and the
      # day's count of commits on the first-parent line; iOS CFBundleVersion
      # and Android versionCode. See docs/RELEASING.md.
      - name: Build number
        run: echo "KLUNKI_BUILD_NUMBER=$(../tool/build_number.sh)" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: >-
          flutter build ios --release --no-codesign
          --dart-define=KLUNKI_BUILD=${{ github.sha }}
          --build-number=${{ env.KLUNKI_BUILD_NUMBER }}
          --dart-define=KLUNKI_BUILD_NUMBER=${{ env.KLUNKI_BUILD_NUMBER }}

  # GitHub Pages (KLD-096, KLD-115): the landing page at the site root
  # (site/index.html), the PWA under play/ and the static pages (privacy/,
  # support/, impressum/ from site/), at https://<owner>.github.io/<repo>/.
  # Merging to main publishes the site. Only on pushes to main and only when the
  # repository variable PAGES_ENABLED is 'true' (Settings > Secrets and
  # variables > Actions > Variables); Pages source must be "GitHub Actions".
  # A separate build from the `pwa` job: a project site lives under /<repo>/,
  # so the app needs --base-href /<repo>/play/, while the `klunki-pwa` artifact
  # stays a root build for `klunki relay --web`. A second web build (a later
  # preview channel, see docs/tasks/KLD-115-landing-page.md) would be one more
  # build step with its own --base-href and output dir plus one more
  # `--app <sub-path>=<dir>` for build_site.py.
  # Note: Pages serves https, and browsers block ws:// from https pages, so the
  # Pages-hosted PWA plays on one device and joins only wss:// relays. KLD-108:
  # this build alone gets KLUNKI_WEB_CHANNEL=pages-beta (a "Beta" badge and a
  # line in "Über Klunki"); network play is greyed out there until a wss://
  # relay is set. KLUNKI_IOS_BETA_URL / KLUNKI_ANDROID_URL come from the
  # optional repository variables of the same names (empty: no app buttons,
  # only the "App-Beta in Vorbereitung." teaser; on the landing page the store
  # entries stay greyed out as "Geschlossene Beta"). See docs/BUILDING.md.
  pages-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    name: Pages site (landing page + PWA under /<repo>/play/ + static pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: klunki
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tool/build_number.sh counts the day's commits on main (KLD-116).
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      # KLD-116: build number YYYYMMDDNN from the commit date (UTC) and the
      # day's count of commits on the first-parent line; iOS CFBundleVersion
      # and Android versionCode. See docs/RELEASING.md.
      - name: Build number
        run: echo "KLUNKI_BUILD_NUMBER=$(../tool/build_number.sh)" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: >-
          flutter build web --release --base-href "/${{ github.event.repository.name }}/play/"
          --dart-define=KLUNKI_BUILD=${{ github.sha }}
          --build-number=${{ env.KLUNKI_BUILD_NUMBER }}
          --dart-define=KLUNKI_BUILD_NUMBER=${{ env.KLUNKI_BUILD_NUMBER }}
          --dart-define=KLUNKI_WEB_CHANNEL=pages-beta
          --dart-define=KLUNKI_IOS_BETA_URL=${{ vars.KLUNKI_IOS_BETA_URL }}
          --dart-define=KLUNKI_ANDROID_URL=${{ vars.KLUNKI_ANDROID_URL }}
      - run: python3 -I build/web/pwa_finalize.py
      - name: No external URLs in the app build
        run: python3 -I tool/check_pwa_external_urls.py build/web
      - run: python3 -I ../site/test_build_site.py
      # Landing page (games and FAQ from the ARB files, store entries from the
      # variables below), privacy/, support/, impressum/ (contact email from
      # site/site.json), the app under play/. build_site.py also fails on any
      # page that loads something from another host.
      - name: Assemble the site
        env:
          KLUNKI_IOS_BETA_URL: ${{ vars.KLUNKI_IOS_BETA_URL }}
          KLUNKI_ANDROID_URL: ${{ vars.KLUNKI_ANDROID_URL }}
        run: python3 -I ../site/build_site.py build/site --app play=build/web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: klunki/build/site

  pages:
    needs: pages-build
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
