name: klunki
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Klunki's game engine lives in a separate pure-Dart package.
  klunki_engine:
    path: ../packages/klunki_engine

  # Host-authoritative network play (pure Dart, TCP).
  klunki_net:
    path: ../packages/klunki_net
  # i18n (I18N-01): gen-l10n + the version of intl that flutter_localizations pins.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  # Persists the chosen app language.
  shared_preferences: ^2.5.6

  # mDNS/DNS-SD advertise + browse of `_klunki._tcp` (KLD-033). Pinned: 7.1.6
  # was published 2026-10-25, too fresh; 7.1.5 (2026-08-11) links via SwiftPM.
  bonsoir: 7.1.5

  # Renders the join QR code (pure Flutter, no permissions; scanning = KLD-052).
  qr_flutter: ^4.1.0

  # Scans a host's QR code to join (KLD-052, KLD-080): zxing-cpp (Apache-2.0)
  # via Dart FFI, compiled from source on Android (CMake/NDK) and iOS (SwiftPM),
  # so no proprietary barcode engine (ML Kit, Apple Vision) is linked. Pinned:
  # 3.1.0 (2026-09-25). FFI, so not on the web (the PWA hides the scan button).
  flutter_zxing: 3.1.0
  # The camera behind flutter_zxing's ReaderWidget (already a transitive dep of
  # flutter_zxing; declared because the scanner uses its torch, error and
  # camera-list APIs). Pinned: 0.12.2 (2026-10-27) is too fresh.
  camera: 0.12.1

  # Opens the Wikipedia article and the image credits of a Quartett card
  # (KLD-082) in the browser (web: a new tab). flutter.dev, BSD-3-Clause.
  # Pinned: 6.3.3 (2026-10-02).
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device/simulator tests in integration_test/ (KLD-038c); ships with the SDK.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled fonts so the PWA renders every locale offline (CanvasKit has no
  # system fonts; see lib/app/fonts.dart, tool/update_web_fonts.py,
  # docs/tasks/I18N-04-rtl.md and docs/tasks/I18N-07-08-offline-fonts.md).
  # All SIL OFL 1.1; the OFL.txt files are read for LicenseRegistry.
  # - Roboto: the web default family. Bundling a family named "Roboto" also
  #   stops CanvasKit from fetching Roboto from fonts.gstatic.com at startup.
  # - NotoSansArabic (ar/fa), NotoSansSC (subset: zh strings + 简体中文),
  #   NotoSansMath (subset: symbols Roboto lacks, e.g. U+2192): fallbacks.
  assets:
    - assets/fonts/Roboto/OFL.txt
    - assets/fonts/NotoSansArabic/OFL.txt
    - assets/fonts/NotoSansSC/OFL.txt
    - assets/fonts/NotoSansMath/OFL.txt
    # Licences of native code that flutter_zxing compiles in (KLD-080), read
    # for LicenseRegistry (lib/app/third_party_licenses.dart).
    - assets/licenses/zxing-cpp/LICENSE
    - assets/licenses/libzint/LICENSE
    # Privacy policy and Impressum as text, readable offline in "Über Klunki"
    # (KLD-102); exported from site/{privacy,impressum}/index.html by
    # site/export_legal_text.py.
    - assets/legal/privacy.json
    - assets/legal/impressum.json
    # The app icon (KLD-097, concept c5-final-d4) for the About screen; written
    # by tool/icon/export_icon_test.dart together with the platform icons.
    - assets/icon/app_icon.png
    # Quartett card photos from Wikimedia Commons (KLD-082): ~480 px JPEGs,
    # credits.json = authors and licences (see docs/tasks/KLD-082-quartett-media.md,
    # tool/fetch_card_media.py). Bundled so they work offline; never hotlinked.
    - assets/quartett/rockets/
    - assets/quartett/planes/
    - assets/quartett/trains/
    - assets/quartett/cars/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic/NotoSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC/NotoSansSC-Bold.ttf
          weight: 700
    - family: NotoSansMath
      fonts:
        - asset: assets/fonts/NotoSansMath/NotoSansMath-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
