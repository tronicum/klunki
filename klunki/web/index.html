<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Klunki – klassische Spiele für zwei: 4 Gewinnt, Mühle, Quartett und Schiffe versenken – auf einem Gerät oder im WLAN. Classic two-player games: Four in a Row, Nine Men's Morris, Quartett and Schiffe versenken – on one device or over Wi-Fi.">
  <meta name="theme-color" content="#4F46E5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Klunki">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Klunki</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { background: #4F46E5; }
  </style>
</head>
<body>
  <!--
    Custom web/flutter_bootstrap.js (KLD-010): loads the app WITHOUT Flutter's
    deprecated service worker settings and with same-origin CanvasKit.
    For details: https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Klunki's own offline service worker (KLD-010). Registered under a different
    script URL than Flutter's cleanup worker (flutter_service_worker.js), which
    is never registered by this page.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      // Hands the URLs this page actually loaded (main.dart.js, the CanvasKit
      // variant chosen for this browser, fonts, ...) to the worker, because on
      // the very first visit those requests happen before it controls the page.
      const warmCache = async () => {
        try {
          const reg = await navigator.serviceWorker.ready;
          const urls = [location.href].concat(
            performance.getEntriesByType('resource').map((e) => e.name));
          if (reg.active) reg.active.postMessage({ type: 'klunki-warm-cache', urls: urls });
        } catch (e) {
          console.warn('Klunki: cache warm-up failed', e);
        }
      };
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('klunki_sw.js', { scope: './' })
          .then((reg) => console.debug('Klunki SW registered, scope:', reg.scope))
          .catch((e) => console.warn('Klunki SW registration failed:', e));
        // Warm up after Flutter rendered (fonts/CanvasKit are loaded by then),
        // with a timeout fallback in case the event never fires.
        let warmed = false;
        const once = () => { if (!warmed) { warmed = true; setTimeout(warmCache, 500); } };
        window.addEventListener('flutter-first-frame', once);
        setTimeout(once, 8000);
      });
    }
  </script>
</body>
</html>
